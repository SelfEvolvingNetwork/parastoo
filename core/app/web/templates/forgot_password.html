{% extends "base.html" %}
{% block title %}یادآوری رمز عبور{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>یادآوری رمز عبور</h1>
  <p class="muted">ایمیل حساب خود را بنویسید؛ اگر در پرستو ثبت‌شده باشد، لینک بازنشانی رمز برایتان فرستاده می‌شود (۶۰ دقیقه اعتبار دارد).</p>
  <form method="post" action="/forgot-password">
    <label>ایمیل
      <input type="email" name="email" required placeholder="you@example.com">
    </label>
    <button class="btn btn-primary btn-block" type="submit">ارسال لینک بازنشانی</button>
  </form>
  <p class="muted"><a href="/login">بازگشت به ورود</a></p>
</div>
{% endblock %}
