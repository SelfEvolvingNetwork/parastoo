{% extends "base.html" %}
{% block title %}بازنشانی رمز عبور{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>بازنشانی رمز عبور</h1>
  <p class="muted">رمز تازه را دو بار بنویسید.</p>
  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label>رمز عبور تازه (حداقل ۶ کاراکتر)
      <input type="password" name="password" required minlength="6">
    </label>
    <label>تکرار رمز تازه
      <input type="password" name="password2" required minlength="6">
    </label>
    <button class="btn btn-primary btn-block" type="submit">ثبت رمز تازه</button>
  </form>
</div>
{% endblock %}
