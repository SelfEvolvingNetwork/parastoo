# پرستو — استک کامل تک‌سرور: Traefik + Gitea + Postgres + هسته پرستو
name: parastoo

networks:
  internal:
    name: parastoo-internal
  apps:
    name: parastoo-apps

volumes:
  postgres_data:
  gitea_data:
  gitea_indexer:
  parastoo_data:
  traefik_certs:
  dns_data:
  dns_meta:

services:
  # ---------- دیتابیس ----------
  postgres:
    image: postgres:16-alpine
    container_name: parastoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parastoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: parastoo
      GITEA_DB_PASSWORD: ${GITEA_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parastoo -d parastoo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ---------- گیت داخلی (+ رجیستری ایمیج) ----------
  gitea:
    image: gitea/gitea:1.23
    container_name: parastoo-gitea
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: ${GIT_DOMAIN}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__packages__ENABLED: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: parastoo-core
      GITEA__mailer__ENABLED: "false"
      GITEA__log__LEVEL: Info
    volumes:
      - gitea_data:/data
      - gitea_indexer:/data/gitea/indexers
    # رجیستری ایمیج روی localhost در دسترس دیمون داکر است (بدون نیاز به پیکربندی ناامن)
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      # start_period: بعد از ری‌استارت دیمون داکر/میزبان، اولین پروب‌های gitea
      # (انعکاس لاگ‌ها، اتصال DB) ممکن است کند باشد؛ خطای آن‌ها نباید unhealthy حساب شود
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.parastoo-git.rule=Host(`${GIT_DOMAIN}`)
      - traefik.http.routers.parastoo-git.entrypoints=${TRAEFIK_ENTRYPOINTS}
      - traefik.http.routers.parastoo-git.tls=${TRAEFIK_TLS}
      - traefik.http.routers.parastoo-git.tls.certresolver=le
      - traefik.http.services.parastoo-git.loadbalancer.server.port=3000

  # ---------- کنترل‌پلین پرستو ----------
  core:
    build:
      context: ./core
      args:
        # تحریم‌ها: در .env مقدار PARASTOO_PIP_INDEX_URL را بگذارید تا pip از آینهٔ ایرانی نصب کند
        PIP_INDEX_URL: ${PARASTOO_PIP_INDEX_URL:-https://pypi.org/simple}
    image: parastoo/core:latest
    container_name: parastoo-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gitea:
        condition: service_healthy
    environment:
      SECRET_KEY: ${PARASTOO_SECRET}
      DATABASE_URL: postgresql+psycopg://parastoo:${POSTGRES_PASSWORD}@postgres:5432/parastoo
      BASE_DOMAIN: ${BASE_DOMAIN}
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      GIT_DOMAIN: ${GIT_DOMAIN}
      APPS_DOMAIN: ${APPS_DOMAIN}
      TLS_ENABLED: ${TLS_ENABLED}
      ACME_EMAIL: ${ACME_EMAIL}
      # v0.3.33 — انتخاب CA و EAB به هسته هم می‌رسد تا بازنویسی استاتیک ترافیک
      # در ویزارد، EAB زروسsl را بی‌صدا نبُرد (قبلاً فقط نصب‌کننده می‌شناخت)
      PARASTOO_ACME_CA: ${PARASTOO_ACME_CA:-}
      PARASTOO_ACME_EAB_KID: ${PARASTOO_ACME_EAB_KID:-}
      PARASTOO_ACME_EAB_HMAC: ${PARASTOO_ACME_EAB_HMAC:-}
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_CONTAINER: parastoo-gitea
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      REGISTRY_INTERNAL: 127.0.0.1:3000
      APPS_NETWORK: parastoo-apps
      DATA_DIR: /data
      PARASTOO_TZ: ${PARASTOO_TZ}
      PARASTOO_DEBT_LIMIT: ${PARASTOO_DEBT_LIMIT}
      PARASTOO_COMMISSION: ${PARASTOO_COMMISSION}
      PARASTOO_SETUP_TOKEN: ${PARASTOO_SETUP_TOKEN:-}
      PARASTOO_PUBLIC_IP: ${PARASTOO_PUBLIC_IP:-}
      # تحریم‌ها: آینه‌های pip/npm برای بیلدهای قالبی کاربران (stacks.py)
      PARASTOO_PIP_INDEX_URL: ${PARASTOO_PIP_INDEX_URL:-}
      PARASTOO_NPM_REGISTRY: ${PARASTOO_NPM_REGISTRY:-}
      PARASTOO_CONFIG_DIR: /app/host-config
      PARASTOO_TRAEFIK_CONTAINER: parastoo-traefik
      # آپدیت خودکار و حالت توسعه‌دهنده (v0.2.12) — از .env خوانده می‌شوند
      PARASTOO_DEPLOYED_COMMIT: ${PARASTOO_DEPLOYED_COMMIT:-}
      PARASTOO_DEPLOYED_AT: ${PARASTOO_DEPLOYED_AT:-}
      PARASTOO_DEV_MODE: ${PARASTOO_DEV_MODE:-false}
      PARASTOO_DEV_TOKEN: ${PARASTOO_DEV_TOKEN:-}
      # نیم‌سرور اختصاصی (v0.3.9) — هسته فقط با REST API با پاوردی‌ان‌اس حرف می‌زند
      PARASTOO_DNS_API_URL: ${PARASTOO_DNS_API_URL:-http://dns:8081/api/v1}
      PARASTOO_DNS_API_KEY: ${PARASTOO_DNS_API_KEY:-}
    volumes:
      - parastoo_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/app/host-config
      # (v0.3.22) .env هاست داخل هسته: تغییر دامنه بتواند GITEA_ROOT_URL و
      # دامنه‌ها را برای اجرای بعدی compose همگام کند — وگرنه پس از یک up،
      # interpolation به مقدار کهنهٔ نصب اول برمی‌گشت (ریشهٔ باگ 404 رجیستری)
      - ./.env:/app/host-env/.env
      # تاریخچهٔ آپدیت خودکار (logs/updates.jsonl روی هاست) برای گزارش /api/dev/updates
      - ./logs:/app/host-logs:ro
      # کلید API تولیدشدهٔ خودکار توسط کانتینر dns (وقتی .env مقداری نداشته باشد)
      - dns_meta:/opt/dns-meta:ro
    networks:
      - internal
      - apps
    labels:
      - traefik.enable=true
      - traefik.http.routers.parastoo-panel.rule=Host(`${PANEL_DOMAIN}`)
      - traefik.http.routers.parastoo-panel.entrypoints=${TRAEFIK_ENTRYPOINTS}
      - traefik.http.routers.parastoo-panel.tls=${TRAEFIK_TLS}
      - traefik.http.routers.parastoo-panel.tls.certresolver=le
      - traefik.http.services.parastoo-panel.loadbalancer.server.port=8000

  # ---------- نیم‌سرور اختصاصی (v0.3.9؛ تعمیر میدانی v0.3.12) — PowerDNS Authoritative ----------
  # دامنه‌های مشتری + دامنهٔ اصلی پرستو را همین‌جا جواب می‌دهند (پورت ۵۳ TCP+UDP).
  # نکتهٔ نسخهٔ ۴۹: متغیرهای PDNS_* این ایمیج به کانفیگ ترجمه نمی‌شوند (issue #14951)
  # → همهٔ تنظیمات را صریح با فلگ خط فرمان می‌دهیم. کلید API: اگر .env مقدار
  # PARASTOO_DNS_API_KEY داشته باشد همان، وگرنه اولین اجرا تولید و در volume مشترک
  # dns_meta می‌نویسد که هسته از همان می‌خواند (صفر-پیکربندی برای مالک).
  # API فقط روی شبکهٔ داخلی در دسترس است (۸۰۸۱ پابلیش نمی‌شود).
  #
  # سه درس میدانی v0.3.12 (هر سه فقط روی نصب واقعی آشکار شدند؛ تست محلی compose را
  # واقعاً بالا نمی‌آورد):
  # (۱) interpolation کمپوز: هر $WORD داخل command با متغیر compose جایگزین می‌شود؛
  #     متغیرهای shell باید $$ باشند — وگرنه $KEY → "" و کلید API تهی ثبت می‌شد و
  #     pdns بی‌کلید بالا می‌آمد (هر درخواست 401). متغیرهای واقعی compose تک-$ می‌مانند.
  # (۲) مالکیت volume: ایمیج با کاربر pdns اجرا می‌شود ولی volume نام‌دار root-owned
  #     ساخته می‌شود → سرویس یک‌بارهٔ dns-init مالکیت را به uid کاربر pdns ایمیج می‌دهد.
  # (۳) پورت ۵۳: systemd-resolved روی 127.0.0.53:53 گوش می‌دهد و بایند TCP
  #     0.0.0.0:53 در سطح کرنل EADDRINUSE می‌گیرد → اگر سرور resolved داشت، در .env
  #     سرور PARASTOO_DNS_BIND_IP=<IPv4-عمومی> بگذارید (پیش‌فرض 0.0.0.0). همچنین نام
  #     تنظیم master در PDNS≥4.8 حذف شده → --primary=yes (Fatal: unknown setting).
  dns-init:
    image: powerdns/pdns-auth-49:4.9.18
    container_name: parastoo-dns-init
    user: "0:0"
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chown -R "$$(id -u pdns):$$(id -g pdns)" /var/lib/powerdns /meta
    volumes:
      - dns_data:/var/lib/powerdns
      - dns_meta:/meta
    networks:
      - internal

  dns:
    image: powerdns/pdns-auth-49:4.9.18
    container_name: parastoo-dns
    restart: unless-stopped
    entrypoint: /bin/sh
    depends_on:
      dns-init:
        condition: service_completed_successfully
    command:
      - -c
      - |
        set -e
        mkdir -p /var/lib/powerdns /meta
        KEY="${PARASTOO_DNS_API_KEY:-}"
        if [ -z "$$KEY" ] && [ -s /meta/api-key ]; then KEY="$$(cat /meta/api-key)"; fi
        if [ -z "$$KEY" ]; then KEY="$$(tr -dc a-f0-9 < /dev/urandom | head -c 48)"; fi
        printf '%s' "$$KEY" > /meta/api-key
        chmod 600 /meta/api-key
        [ -s /var/lib/powerdns/pdns.sqlite3 ] || pdnsutil create-schema \
          --launch=gsqlite3 --gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
        exec pdns_server \
          --launch=gsqlite3 \
          --gsqlite3-database=/var/lib/powerdns/pdns.sqlite3 \
          --local-address=0.0.0.0 \
          --local-port=53 \
          --primary=yes \
          --allow-axfr-ips=${PARASTOO_DNS_ALLOW_AXFR:-127.0.0.0/8,::1} \
          --api=yes \
          --webserver=yes \
          --webserver-address=0.0.0.0 \
          --webserver-port=8081 \
          --webserver-allow-from=0.0.0.0/0,::/0 \
          --api-key="$$KEY" \
          --default-soa-content='ns1.@ hostmaster.@ 0 10800 3600 604800 3600' \
          --version-string=parastoo
    environment:
      PARASTOO_DNS_API_KEY: ${PARASTOO_DNS_API_KEY:-}
    ports:
      - "${PARASTOO_DNS_BIND_IP:-0.0.0.0}:53:53"
      - "${PARASTOO_DNS_BIND_IP:-0.0.0.0}:53:53/udp"
    volumes:
      - dns_data:/var/lib/powerdns
      - dns_meta:/meta
    healthcheck:
      # ایمیج pdns هیچ کلاینت HTTP/دستگاه DNS ندارد (wget/curl/dig نیست) و dash
      # /dev/tcp هم ندارد؛ مطمئن‌ترین سیگنال زنده‌بودن: controlsocket که فقط
      # pdns_serverِ واقعاً اجراشده می‌سازد (exit-code pdns خودش با restart policy پوشش داده می‌شود).
      test: ["CMD-SHELL", "test -S /var/run/pdns/pdns.controlsocket || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  # ---------- پروکسی و TLS ----------
  traefik:
    # پینِ دقیقِ تگ: Docker Engine 29+ حداقلِ نسخهٔ API دیمون را به 1.44 برده و
    # ترافیکِ قدیمی‌تر از v3.6.6 با «client version 1.24 is too old» می‌میرد →
    # docker provider هیچ کانتینری را نمی‌بیند → هیچ روتری ساخته نمی‌شود → همه‌چیز 404.
    image: traefik:v3.6.6
    container_name: parastoo-traefik
    restart: unless-stopped
    # v0.3.33 — الگوی ساب‌دامنهٔ بی‌نهایت: گواهی وایلدکارد *.apps.<دامنه> با چالش
    # DNS-01 مستقیماً روی PDNS خودمان (ارائه‌دهندهٔ pdns lego). کلید API از همان
    # فایل مشترک dns_meta خوانده می‌شود که خود dns می‌نویسد (پسوند _FILE lego؛
    # dns همیشه مقدار مؤثر را همان‌جا می‌نویسد، چه دستی چه خودکار — صفر-پیکربندی).
    # depends_on تضمین می‌کند فایل کلید پیش از اولین سفارش ACME موجود است.
    depends_on:
      dns:
        condition: service_healthy
    environment:
      PDNS_API_URL: http://dns:8081
      PDNS_API_KEY_FILE: /meta/api-key
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dns_meta:/meta:ro
    networks:
      - internal
      - apps
