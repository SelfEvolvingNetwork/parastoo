name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌های هسته (نسخه‌های پین‌شده — خودش آزمون requirements است)
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt
          pip install pyyaml

      - name: سینتکس اسکریپت‌های شل
        run: |
          bash -n install.sh
          bash -n setup.sh
          bash -n bootstrap.sh
          bash -n uninstall.sh
          bash -n scripts/factory-reset.sh
          bash -n scripts/check-mirrors.sh
          bash -n scripts/fetch-images.sh
          bash -n bin/parastoo

      - name: تست‌های دودی (بدون دسترسی شبکه)
        env:
          PARASTOO_SMOKE_OFFLINE: "1"
        run: |
          python tests/smoke_test.py
          python tests/smoke_wizard.py
          python tests/smoke_sanctions.py
          python tests/smoke_gitea.py
          bash tests/factory_reset_test.sh
